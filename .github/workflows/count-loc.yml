name: Count Lines of Code

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  count-lines-of-code:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📊 Count lines of code
        id: count
        run: |
          echo "# Lines of Code Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count PHP files
          php_files=$(find . -type f -name "*.php" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          php_lines=$(find . -type f -name "*.php" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count JavaScript files
          js_files=$(find . -type f -name "*.js" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          js_lines=$(find . -type f -name "*.js" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count CSS files
          css_files=$(find . -type f -name "*.css" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          css_lines=$(find . -type f -name "*.css" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count HTML files
          html_files=$(find . -type f -name "*.html" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          html_lines=$(find . -type f -name "*.html" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count Shell scripts
          sh_files=$(find . -type f -name "*.sh" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          sh_lines=$(find . -type f -name "*.sh" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count YAML files
          yaml_files=$(find . -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          yaml_lines=$(find . -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Count SQL files
          sql_files=$(find . -type f -name "*.sql" ! -path "*/vendor/*" ! -path "*/node_modules/*" | wc -l)
          sql_lines=$(find . -type f -name "*.sql" ! -path "*/vendor/*" ! -path "*/node_modules/*" -exec cat {} + | wc -l)

          # Calculate totals
          total_files=$((php_files + js_files + css_files + html_files + sh_files + yaml_files + sql_files))
          total_lines=$((php_lines + js_lines + css_lines + html_lines + sh_lines + yaml_lines + sql_lines))

          # Display results in table format
          echo "## Summary by File Type" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File Type | Files | Lines of Code |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| PHP | $php_files | $php_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript | $js_files | $js_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS | $css_files | $css_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML | $html_files | $html_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell | $sh_files | $sh_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML | $yaml_files | $yaml_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL | $sql_files | $sql_lines |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$total_files** | **$total_lines** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also output to console
          echo "========================================="
          echo "Lines of Code Summary"
          echo "========================================="
          printf "%-15s %10s %15s\n" "File Type" "Files" "Lines of Code"
          echo "-----------------------------------------"
          printf "%-15s %10s %15s\n" "PHP" "$php_files" "$php_lines"
          printf "%-15s %10s %15s\n" "JavaScript" "$js_files" "$js_lines"
          printf "%-15s %10s %15s\n" "CSS" "$css_files" "$css_lines"
          printf "%-15s %10s %15s\n" "HTML" "$html_files" "$html_lines"
          printf "%-15s %10s %15s\n" "Shell" "$sh_files" "$sh_lines"
          printf "%-15s %10s %15s\n" "YAML" "$yaml_files" "$yaml_lines"
          printf "%-15s %10s %15s\n" "SQL" "$sql_files" "$sql_lines"
          echo "-----------------------------------------"
          printf "%-15s %10s %15s\n" "Total" "$total_files" "$total_lines"
          echo "========================================="
